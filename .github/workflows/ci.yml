name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소한다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · test · audit · aot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 서버는 Linux 배포가 주 대상이지만 개발은 Windows 에서 한다.
        # 소켓 계층은 두 플랫폼에서 동작이 갈리므로 양쪽을 모두 돌린다.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # dotnet-version 을 적지 않는다. global.json 을 읽게 해서
      # 로컬과 CI 가 같은 SDK 를 쓰도록 만든다.
      #
      # '10.0.x' 로 두면 최신 피처 밴드를 잡고, 로컬보다 앞서면 그 SDK 에만 있는
      # 분석기 규칙이 CI 에서만 터진다 — 실제로 CA2025 가 그렇게 발생했다.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ matrix.os }}-

      # 로컬과 동일한 스크립트를 쓴다. CI 에서만 깨지는 상황을 막는다.
      #
      # -Coverage 는 CI 에서만 켠다 — 테스트를 느리게 만들므로 로컬 반복에는 부담이다.
      # 취약점 감사는 기본으로 켜져 있다(Phase 0 게이트 조건).
      - name: Build · Test · Audit · AOT
        shell: pwsh
        run: ./eng/build.ps1 -Configuration Release -WarnAsError -Coverage

      # 커버리지는 실패하지 않아도 남긴다. 임계값이 없는 지금은
      # "추세를 볼 수 있게 하는 것"이 목적이다.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  # 성능 회귀 게이트. build 잡과 분리한 이유 둘:
  #  ① 벤치마크는 느리다(로컬 ENV-B 에서 6분) — build·test 피드백을 늦추면 안 된다
  #  ② OS 한 종류면 충분하다. 이 게이트는 절대 시간이 아니라 **같은 실행 안의 비율**을
  #     보므로 플랫폼별로 값이 갈리지 않는다. 두 OS 로 돌리면 비용만 두 배다
  bench-gate:
    name: 성능 회귀 게이트 (비율)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-bench-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-bench-

      # 공용 러너는 이웃 부하로 절대 시간이 20~30% 흔들린다. 그래서 이 게이트는
      # 절대 수치를 판정하지 않고 두 팔의 비율만 본다 — 노이즈가 분자·분모에 함께
      # 실려 상쇄된다. 명세와 임계 근거는 eng/bench-gate.json.
      - name: Bench gate
        shell: pwsh
        run: ./eng/bench-gate.ps1

      # 실패했을 때 사람이 원본 측정을 볼 수 있어야 한다. 게이트 출력만으로는
      # "노이즈인가 진짜 회귀인가" 를 판단할 수 없다.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-gate-results
          path: BenchmarkDotNet.Artifacts/results/**
          if-no-files-found: warn
          retention-days: 14
