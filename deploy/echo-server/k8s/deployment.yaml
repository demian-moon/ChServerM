# EchoServer 배포 예제 (Phase 22).
#
# 전제: 이미지가 클러스터에서 접근 가능한 위치에 있어야 한다.
#   - 로컬(docker-desktop): `docker build ...` 만으로 노드가 같은 데몬을 쓰므로 충분하다
#   - 원격 클러스터: 레지스트리에 push 하고 image 를 그 경로로 바꾼다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chserverm-echo
  labels:
    app.kubernetes.io/name: chserverm-echo
    app.kubernetes.io/part-of: chserverm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chserverm-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chserverm-echo
        app.kubernetes.io/part-of: chserverm
    spec:
      # SIGTERM 후 드레인 시간. 샘플의 종료 경로는 Unbind(신규 수용 중단) →
      # 드레인(최대 10초) → Stop 이므로 그보다 여유 있게 잡는다.
      terminationGracePeriodSeconds: 30
      containers:
        - name: echo
          image: chserverm/echo-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-echo
              containerPort: 5000
              protocol: TCP
          # 프레임 프로토콜이라 HTTP 프로브를 쓸 수 없다 — TCP 연결 수립로 대신한다.
          # (연결 수립 = 수용 루프 생존. 파이프라인 심층 헬스는 Diagnostics.Http 를
          # 붙이는 조합에서 httpGet 으로 바꾼다.)
          readinessProbe:
            tcpSocket:
              port: tcp-echo
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: tcp-echo
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # Native AOT 에코 서버의 상주 메모리는 수 MiB 수준이다. 한계는 여유 있게.
            # CPU limit 은 걸지 않는다 — ServerGC 힙 수·스로틀링에 영향을 주므로
            # 실제 워크로드에서 측정 후 정한다(측정 없는 최적화 금지).
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            # 이미지가 이미 비루트($APP_UID)로 실행된다 — 여기서 한 번 더 강제한다.
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
